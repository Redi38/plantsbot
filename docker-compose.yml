services:
  plant-bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - plant_bot_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/plants.db

  plant-admin:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    ports:
      - "8010:8000"
    volumes:
      - plant_bot_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/plants.db

volumes:
  plant_bot_data:
