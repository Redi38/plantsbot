services:
  plant-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - plant_bot_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/plants.db

  plant-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    volumes:
      - plant_bot_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/plants.db
    ports:
      - "8080:8080"

volumes:
  plant_bot_data:
